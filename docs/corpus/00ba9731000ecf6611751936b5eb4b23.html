<main data-pagefind-body>川のまち旭川｜歴史探索マップ 大雪山に降り積もった雪が 何十年、何百年の旅をへて大地に染み渡り ろ過された伏流水が旭川にゆっくりと運ばれ 川となって湧き出ている、大自然の恵みの水。 旭川はその大自然の恵み、川のおかげで ここまで発展した といっても過言ではありません。 その清らかな銘水は、私達の暮らしに様々な形で 豊かな潤いをもたらしています。 さて、その川が どのように旭川の発展に関わっているのか ご紹介いたします。</main>
