let kTimer = null;
let topLinkHtml = '';
function renderKCard(term) {
  if (kTimer) { clearInterval(kTimer); kTimer = null; }
  kcardEl.innerHTML = '';
  topLinkHtml = '';
  const key = term.replace(/[\s\u3000]/g, '');
  const card = KCARDS.find(c => c.aliases.includes(key) && (!c.city || c.city === cityMode));
  if (!card) return;

  if (card.photos && card.photos.length > 0) {
    // 写真ありはこれまで通りのカード(旭川スライドショー)
    const imgs = card.photos.map((p, i) =>
      `<img src="${p}" alt="${card.title}" class="${i === 0 ? 'active' : ''}">`).join('');
    const bars = card.photos.map((p, i) =>
      `<span class="${i === 0 ? 'done' : ''}"></span>`).join('');
    kcardEl.innerHTML = `<div class="kcard">
      <div class="kslide">${imgs}<div class="kbars">${bars}</div></div>
      <a class="ktitle" href="${card.url}" target="_blank" rel="noopener">${card.title}</a>
      <p class="kyomi">${card.yomi}</p>
      <p class="kdesc">${card.desc}</p>
      <p class="ksource">写真提供:旭川市フォトライブラリー ・ リンク先:公式サイト</p>
    </div>`;
    const slides = kcardEl.querySelectorAll('.kslide img');
    if (slides.length > 1) {
      let idx = 0;
      const barEls = kcardEl.querySelectorAll('.kbars span');
      kTimer = setInterval(() => {
        slides[idx].classList.remove('active');
        idx = (idx + 1) % slides.length;
        slides[idx].classList.add('active');
        barEls.forEach((b, i) => b.classList.toggle('done', i <= idx));
        if (idx === 0) barEls.forEach((b, i) => b.classList.toggle('done', i === 0));
      }, 4000);
    }
  } else {
    // 写真なしは通常の検索結果と同じ見た目で、結果リストの先頭に差し込む
    let domain = '';
    try { domain = new URL(card.url).hostname; } catch(e) {}
    topLinkHtml = `<div class="result">
      <div class="site">
        <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" alt="">
        <div><div class="sitename">${card.title}</div><div class="siteurl">${card.url}</div></div>
      </div>
      <a class="rtitle" href="${card.url}" target="_blank" rel="noopener">${card.title} - 公式サイト</a>
      <p class="excerpt">${card.desc}</p>
    </div>`;
  }
}

async function doSearch(term) {
  lastTerm = term;
  clearBtn.classList.remove('show');  // 検索実行で×を隠す(Google式)
  renderKCard(term);
  const pf = await ensurePagefind();
  const res = await pf.search(term, { excerptLength: 60 });
  // トップページ・浅い階層のページを優先する並べ替え
  const scored = await Promise.all(res.results.map(async r => {
    const d = await r.data();
    const url = (d.meta && d.meta.url) || d.url || '';
    let depth = 9;
    try { depth = new URL(url).pathname.split('/').filter(Boolean).length; } catch(e) {}
    // Pagefindの元の並び(index)を基礎に、階層の浅さで加点
    return { r, d, depth };
  }));
  scored.sort((a, b) => {
    const sa = scored.indexOf(a) - (a.depth <= 1 ? 50 : a.depth <= 2 ? 10 : 0);
    const sb = scored.indexOf(b) - (b.depth <= 1 ? 50 : b.depth <= 2 ? 10 : 0);
    return sa - sb;
  });
  // 同じページ(URL)の重複を除去(末尾スラッシュやindex.htmlの違いも同一視)
  const seenUrls = new Set();
  const deduped = [];
  for (const s of scored) {
    let key = ((s.d.meta && s.d.meta.url) || s.d.url || '')
      .replace(/\/(index\.html?)?$/, '');
    try { key = decodeURI(key); } catch(e) {}
    if (seenUrls.has(key)) continue;
    seenUrls.add(key);
    deduped.push(s);
  }
  results = deduped.map(s => s.r);
  page = 1;
  loaded = PER_PAGE;
  render();
}

async function renderWiki(term) {
  const box = document.getElementById('ddgweb');
  if (!box) return;
  const esc = x => (x || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const api = 'https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*'
    + '&prop=extracts&exintro=1&explaintext=1&exchars=260'
    + '&generator=search&gsrlimit=1&gsrsearch=' + encodeURIComponent(term);
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    const res = await fetch(api, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) return;
    const j = await res.json();
    const pages = j && j.query && j.query.pages;
    if (!pages) return;
    const p = Object.values(pages)[0];
    if (!p || !p.extract) return;
    const title = p.title || term;
    // 検索語とタイトルが無関係なら出さない(精度対策)
    const norm = x => (x || '').replace(/\s|\u3000/g, '').toLowerCase();
    const nt = norm(title), nq = norm(term);
    if (nt && nq && !nt.includes(nq) && !nq.includes(nt)) return;
    const wikiUrl = 'https://ja.wikipedia.org/wiki/' + encodeURIComponent(title.replace(/ /g, '_'));
    let extract = p.extract.trim();
    if (extract.length > 240) extract = extract.slice(0, 240) + '…';
    const crumb = 'https://ja.wikipedia.org › wiki › ' + esc(title);
    box.innerHTML = '<div class="result">'
      + '<div class="site">'
      + '<img src="https://www.google.com/s2/favicons?domain=ja.wikipedia.org&sz=64" alt="">'
      + '<div><div class="sitename">ウィキペディア</div><div class="siteurl">' + crumb + '</div></div>'
      + '</div>'
      + '<a class="rtitle" href="' + wikiUrl + '" target="_blank" rel="noopener">' + esc(title) + ' - Wikipedia</a>'
      + '<p class="excerpt">' + esc(extract) + '</p>'
      + '</div>';
  } catch (e) { /* Wikipedia失敗は無視 */ }
}

async function render() {
  const total = results.length;
  countEl.textContent = total ? `「${lastTerm}」の${total}件の検索結果` : '';
  countEl.style.display = total ? '' : 'none';

  let start, end;
  if (isMobile()) { start = 0; end = Math.min(total, loaded); }
  else { start = (page - 1) * PER_PAGE; end = Math.min(total, start + PER_PAGE); }

  const datas = await Promise.all(results.slice(start, end).map(r => r.data()));
  // Wikipedia(常に上部に1件表示。該当記事がなければ何も出ない)
  let ddgTop = '<div id="ddgweb"></div>';
  setTimeout(() => renderWiki(lastTerm), 0);
  resultsEl.innerHTML = ddgTop + topLinkHtml + datas.map(d => {
    const url = (d.meta && d.meta.url) || d.url;
    const title = (d.meta && d.meta.title) || url;
    let domain = '', dispUrl = url;
    try {
      const u = new URL(url);
      domain = u.hostname;
      const parts = u.pathname.split('/').filter(Boolean).map(p => {
        try { return decodeURIComponent(p); } catch(e) { return p; }
      });
      dispUrl = 'https://' + domain + (parts.length ? ' \u203a ' + parts.join(' \u203a ') : '');
      if (dispUrl.length > 80) dispUrl = dispUrl.slice(0, 80) + '…';
    } catch(e) {}
    const names = {
      'www.city.asahikawa.hokkaido.jp': '旭川市',
      'www.atca.jp': '旭川観光コンベンション協会'
    };
    const siteName = names[domain] || domain;
    return `<div class="result">
      <div class="site">
        <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" alt="">
        <div><div class="sitename">${siteName}</div><div class="siteurl">${dispUrl}</div></div>
      </div>
      <a class="rtitle" href="${url}" target="_blank" rel="noopener">${title}</a>
      <p class="excerpt">${d.excerpt}</p>
    </div>`;
  }).join('');

  resultsEl.insertAdjacentHTML('beforeend', '<div id="allvideos"></div>');
  renderAllTabVideos(lastTerm);

  pagerEl.innerHTML = '';
  if (isMobile()) {
    if (end < total) {
      const b = document.createElement('button');
      b.id = 'loadmore'; b.textContent = '次を読み込む';
      b.onclick = () => { loaded += PER_PAGE; render(); };
      pagerEl.appendChild(b);
    }
  } else if (total > 0) {
    const pages = Math.ceil(total / PER_PAGE);
    if (pages > 1) {
      const addLink = (n, label, cur) => {
        const a = document.createElement('a');
        a.textContent = label || n;
        if (cur) a.className = 'cur';
        else a.onclick = () => { page = n; render(); scrollTo(0, 0); };
        pagerEl.appendChild(a);
      };
      let s = Math.max(1, page - 3);
      let e = Math.min(pages, s + 6);
      if (s > 1) { addLink(1, '1'); pagerEl.append('…'); }
      for (let i = s; i <= e; i++) addLink(i, String(i), i === page);
      if (e < pages) { pagerEl.append('…'); addLink(pages, String(pages)); }
      if (page < pages) addLink(page + 1, '次へ >');
    }
  }
}

function setMode(searching) {
  document.body.classList.toggle('search-mode', searching);
  document.body.classList.toggle('home-mode', !searching);
  home.classList.toggle('hidden', searching);
  popular.classList.toggle('hidden', !searching);
  if (!searching) {
    countEl.textContent = ''; resultsEl.innerHTML = ''; pagerEl.innerHTML = ''; kcardEl.innerHTML = ''; topLinkHtml = '';
    document.body.classList.remove('news-mode', 'weather-mode', 'video-mode', 'paper-mode');
    const tabs = document.querySelectorAll('#tabs .tab');
    tabs.forEach(x => x.classList.remove('active'));
    if (tabs[0]) tabs[0].classList.add('active');
  }
}

const clearBtn = document.getElementById('clearbtn');
function updateClearBtn() { clearBtn.classList.toggle('show', q.value.length > 0); }
q.addEventListener('input', updateClearBtn);
q.addEventListener('focus', updateClearBtn);  // 検索バーに触れたら再表示
clearBtn.addEventListener('click', () => {
  q.value = '';
  updateClearBtn();
  q.focus();
});

q.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const term = q.value.trim();
  if (!term) { setMode(false); return; }
  setMode(true);
  if (document.body.classList.contains('video-mode')) {
    lastTerm = term;
    loadVideos();      // 動画タブ中は動画の絞り込みを更新
  } else if (document.body.classList.contains('paper-mode')) {
    lastTerm = term;
    loadPapers();      // 論文タブ中は論文を再検索
  } else if (document.body.classList.contains('news-mode')
          || document.body.classList.contains('weather-mode')) {
    // ニュース/気象タブ中は表示を維持(内容は検索語に依存しない)
  } else {
    doSearch(term);    // 通常の検索
  }

let videoData = null;
function pEsc(x){ return (x||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const PROXY = 'https://academic-proxy.cl-3250541292.workers.dev';

async function fetchJstage(term){
  const url = PROXY + '/jstage?service=3&count=15&start=1&text=' + encodeURIComponent(term);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  try{
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const doc = new DOMParser().parseFromString(await res.text(), 'text/xml');
    const txt = (el, sel) => { const n = el.querySelector(sel); return n ? n.textContent.trim() : ''; };
    const tg  = (el, name) => { const n = el.getElementsByTagName(name)[0]; return n ? n.textContent.trim() : ''; };
    const out = [];
    for(const e of doc.getElementsByTagName('entry')){
      const link = txt(e, 'article_link > ja') || txt(e, 'article_link > en');
      if(!link) continue;
      out.push({
        title: txt(e, 'article_title > ja') || txt(e, 'article_title > en') || '(無題)',
        link: link,
        authors: Array.from(e.querySelectorAll('author > ja > name')).map(n => n.textContent.trim()),
        jr: txt(e, 'material_title > ja') || txt(e, 'material_title > en'),
        vol: tg(e, 'prism:volume'), num: tg(e, 'prism:number'),
        sp: tg(e, 'prism:startingPage'), ep: tg(e, 'prism:endingPage'),
        year: tg(e, 'pubyear'), doi: tg(e, 'prism:doi'),
        pdf: link.replace('/_article', '/_pdf'),
      });
    }
    return { items: out, total: tg(doc, 'opensearch:totalResults') };
  }catch(e){ clearTimeout(timer); return { items: [], total: 0, err: e.message || e.name }; }
}

function jCard(it){
  let bib = [];
  if(it.year) bib.push(it.year + '年');
  if(it.vol) bib.push(it.vol + ' 巻');
  if(it.num && it.num !== '0') bib.push(it.num + ' 号');
  if(it.sp) bib.push(it.sp + (it.ep ? '-' + it.ep : ''));
  let h = '<div class="result">'
    + '<a class="rtitle" href="' + it.link + '" target="_blank" rel="noopener">' + pEsc(it.title) + '</a>';
  if(it.authors.length) h += '<div class="pauth">' + pEsc(it.authors.slice(0,6).join(', ')) + (it.authors.length > 6 ? ' ほか' : '') + '</div>';
  if(it.jr) h += '<div class="pjr">' + pEsc(it.jr) + '</div>';
  if(bib.length) h += '<div class="pmeta">' + pEsc(bib.join(' ')) + '</div>';
  if(it.doi) h += '<div class="pdoi"><span class="pbadge">DOI</span> <a href="https://doi.org/' + it.doi + '" target="_blank" rel="noopener">https://doi.org/' + pEsc(it.doi) + '</a></div>';
  h += '<div class="ptags"><span class="ptag ptag-j">ジャーナル</span>'
     + '<a class="ptag ptag-p" href="' + it.pdf + '" target="_blank" rel="noopener">PDFを開く</a></div>';
  return h + '</div>';
}

// IRDBの表示切替(true にすると機関リポジトリのセクションが出る)
const IRDB_ENABLED = false;
async function fetchIrdb(term){
  const url = PROXY + '/irdb?format=atom&fulltext=1&lang=ja&count=20&start=1&q=' + encodeURIComponent(term);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  try{
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const doc = new DOMParser().parseFromString(await res.text(), 'text/xml');
    const tg = (el, n) => { const x = el.getElementsByTagName(n)[0]; return x ? x.textContent.trim() : ''; };
    const out = [];
    for(const e of doc.getElementsByTagName('entry')){
      const linkEl = e.getElementsByTagName('link')[0];
      const link = tg(e, 'URI') || (linkEl ? linkEl.getAttribute('href') : '');
      if(!link) continue;
      out.push({
        title: tg(e, 'title') || '(無題)',
        link: link,
        authors: Array.from(e.getElementsByTagName('name')).map(n => n.textContent.trim()),
        jr: tg(e, 'prism:publicationName') || tg(e, 'publisher') || '',
        ir: tg(e, 'irname'),
        vol: tg(e, 'prism:volume'), num: tg(e, 'prism:number'),
        sp: tg(e, 'prism:startingPage'), ep: tg(e, 'prism:endingPage'),
        date: tg(e, 'prism:publicationDate'),
      });
    }
    return { items: out, total: tg(doc, 'opensearch:totalResults') };
  }catch(e){ clearTimeout(timer); return { items: [], total: 0, err: e.message || e.name }; }
}

function iCard(it){

  if(it.vol) bib.push(it.vol + ' 巻');

  if(it.sp) bib.push(it.sp + (it.ep ? '-' + it.ep : ''));
  let h = '<div class="result">'
    + '<a class="rtitle" href="' + it.link + '" target="_blank" rel="noopener">' + pEsc(it.title) + '</a>';
  if(it.authors.length) h += '<div class="pauth">' + pEsc(it.authors.slice(0,6).join(', ')) + (it.authors.length > 6 ? ' ほか' : '') + '</div>';

     + (it.ir ? '<span class="ptag ptag-b">' + pEsc(it.ir) + '</span>' : '')
     + '<a class="ptag ptag-p" href="' + it.link + '" target="_blank" rel="noopener">本文を見る</a></div>';

}

async function loadPapers(){
  const box = document.getElementById('papers');
  if(!box) return;
  const term = q.value.trim();
  if(!term){ box.innerHTML = '<div class="nempty">検索したい言葉を入力してください。</div>'; return; }
  box.innerHTML = '<div class="nempty">読み込み中…</div>';

  const cinii = (async () => {
    try{
      const url = 'https://cir.nii.ac.jp/opensearch/all?format=json&count=50&q=' + encodeURIComponent(term);
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 10000);
      const res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(timer);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      return { items: j.items || [], total: j['opensearch:totalResults'] || 0 };
    }catch(e){ return { items: [], total: 0, err: e.message || e.name }; }
  })();

  const [jst, ird, cin] = await Promise.all([
    fetchJstage(term),
    IRDB_ENABLED ? fetchIrdb(term) : Promise.resolve({ items: [], total: 0 }),
    cinii
  ]);

  const pIds = (it, t) => { let a = it['dc:identifier'] || []; if(!Array.isArray(a)) a = [a];
    return a.filter(x => x && x['@type'] === t).map(x => x['@value']); };

  function pCard(it){
    const doi  = pIds(it, 'cir:DOI')[0];
    const ncid = pIds(it, 'cir:NCID')[0];
    const jr   = it['prism:publicationName'] || '';
    const title = it.title || jr || '(無題)';
    const usedJr = !it.title && jr;
    let au = it['dc:creator'] || []; if(!Array.isArray(au)) au = [au];
    au = au.map(a => (typeof a === 'string' ? a : (a && a.name) || '')).filter(Boolean);
    const date = it['prism:publicationDate'] || '';
    const year = date ? String(date).slice(0, 4) : '';
    const vol = it['prism:volume'], sp = it['prism:startingPage'], ep = it['prism:endingPage'];
    let bib = [];
    if(year) bib.push(year + '年');
    if(vol && vol !== '0') bib.push(vol + ' 巻');
    if(sp && sp !== '-') bib.push(sp + (ep && ep !== '-' ? '-' + ep : ''));
    const link = doi ? ('https://doi.org/' + doi)
               : (ncid ? ('https://ci.nii.ac.jp/ncid/' + ncid)
               : ((it.link && it.link['@id']) || it['@id'] || ''));
    const tags = [];
    if(doi) tags.push('<span class="ptag ptag-j">ジャーナル</span>');
    if((it['dc:type'] || '') === 'Book') tags.push('<span class="ptag ptag-b">図書</span>');
    let h = '<div class="result">'
      + '<a class="rtitle" href="' + link + '" target="_blank" rel="noopener">' + pEsc(title) + '</a>';
    if(au.length) h += '<div class="pauth">' + pEsc(au.slice(0,6).join(', ')) + (au.length > 6 ? ' ほか' : '') + '</div>';
    if(jr && !usedJr) h += '<div class="pjr">' + pEsc(jr) + '</div>';
    if(bib.length) h += '<div class="pmeta">' + pEsc(bib.join(' ')) + '</div>';
    if(date) h += '<div class="pmeta">発行日: ' + pEsc(date) + '</div>';
    if(doi) h += '<div class="pdoi"><span class="pbadge">DOI</span> <a href="https://doi.org/' + doi + '" target="_blank" rel="noopener">https://doi.org/' + pEsc(doi) + '</a></div>';
    if(ncid) h += '<div class="pdoi"><span class="pbadge">CiNii Books</span> <a href="https://ci.nii.ac.jp/ncid/' + ncid + '" target="_blank" rel="noopener">所蔵図書館を見る</a></div>';
    if(tags.length) h += '<div class="ptags">' + tags.join('') + '</div>';
    return h + '</div>';
  }

  const seen = {};
  for(const it of jst.items) if(it.doi) seen[it.doi.toLowerCase()] = 1;
  const web = [], lib = [], other = [];
  for(const it of cin.items){
    const d = pIds(it, 'cir:DOI')[0];
    if(d && seen[d.toLowerCase()]) continue;   // J-STAGEと重複は除く
    if(d) web.push(it);
    else if((it['dc:type'] || '') === 'Book' || pIds(it, 'cir:NCID')[0]) lib.push(it);
    else other.push(it);
  }

  if(!jst.items.length && !ird.items.length && !cin.items.length){
    box.innerHTML = '<div class="nempty">論文が見つかりませんでした。</div>'; return;
  }
  let html = '<h2>「' + pEsc(term) + '」の論文</h2>';
  if(jst.items.length) html += '<h3 class="psec">J-STAGEで本文が読める ' + jst.items.length + '件'
    + (jst.total ? '<span style="font-weight:400;color:#5f6368;font-size:0.85rem;"> ・ 全' + jst.total + '件</span>' : '')
    + '</h3>' + jst.items.map(jCard).join('');
  if(ird.items.length) html += '<h3 class="psec">機関リポジトリで本文が読める ' + ird.items.length + '件'
    + (ird.total ? '<span style="font-weight:400;color:#5f6368;font-size:0.85rem;"> ・ 全' + ird.total + '件</span>' : '')
    + '</h3>' + ird.items.map(iCard).join('');
  if(web.length)   html += '<h3 class="psec">Webで読める（DOIあり） ' + web.length + '件</h3>' + web.map(pCard).join('');
  if(lib.length)   html += '<h3 class="psec">図書館に所蔵 ' + lib.length + '件</h3>' + lib.map(pCard).join('');
  if(other.length) html += '<h3 class="psec">その他 ' + other.length + '件</h3>' + other.map(pCard).join('');
  html += '<p style="margin:16px 0;">'
    + '<a href="https://www.jstage.jst.go.jp/result/global/-char/ja?globalSearchKey=' + encodeURIComponent(term) + '" target="_blank" rel="noopener">J-STAGEで見る</a>'
    + ' ・ <a href="https://cir.nii.ac.jp/all?q=' + encodeURIComponent(term) + '" target="_blank" rel="noopener">CiNii Researchで見る</a></p>';
  box.innerHTML = html;
}
let curatedData = null;
async function loadCurated(){
  if(curatedData) return curatedData;
  try{ const r = await fetch('curated.json?_=' + Date.now()); curatedData = await r.json(); }
  catch(e){ curatedData = { keywords: {} }; }
  if(!curatedData.keywords) curatedData.keywords = {};
  return curatedData;
}
function cShuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function cMatchKey(term){
  if(!term || !curatedData) return null;
  let best=null;
  for(const kw in curatedData.keywords){ if(term.includes(kw) && (!best || kw.length>best.length)) best=kw; }
  return best;
}
function cOrder(list){ const p=list.filter(v=>v.pin); const r=cShuffle(list.filter(v=>!v.pin)); return p.concat(r); }
function cPool(){ const seen={}, out=[]; for(const k in curatedData.keywords) for(const v of curatedData.keywords[k]){ if(!seen[v.id]){ seen[v.id]=1; out.push(v); } } return out; }
function cVitem(it){
  return '<a class="vitem" href="https://www.youtube.com/watch?v=' + it.id + '" target="_blank" rel="noopener">'
    + '<img class="vthumb" src="https://i.ytimg.com/vi/' + it.id + '/mqdefault.jpg" alt="" loading="lazy">'
    + '<div><div class="vtitle">' + (it.title || '') + '</div>'
    + '<div class="vmeta">YouTube' + (it.channel ? ' \u30fb ' + it.channel : '') + '</div></div></a>';
}
async function renderAllTabVideos(term){
  await loadCurated();
  const kw = cMatchKey(term);
  let list = kw ? cOrder(curatedData.keywords[kw]) : cShuffle(cPool()).slice(0,6);
  const box = document.getElementById('allvideos');
  if(!box) return;
  if(!list || !list.length){ box.innerHTML=''; return; }
  let h = '<h2 style="font-size:1.1rem;margin:28px 0 12px;color:#202124;">\u95a2\u9023\u3059\u308b\u52d5\u753b</h2>';
  for(const it of list.slice(0,8)) h += cVitem(it);
  box.innerHTML = h;
}
async function loadVideos(){
  const box = document.getElementById('videos');
  box.innerHTML = '<div class="nempty">読み込み中…</div>';
  try{
    if(!videoData){
      const res = await fetch('videos.json?_=' + Date.now());
      videoData = await res.json();
    }
    const term = q.value.trim();
    await loadCurated();
    let items, heading;
    if(term.includes('ニュース')){
      items = (videoData.items || []).filter(it => it.city === 'news');
      heading = '北海道のニュース動画';
    } else {
      items = (videoData.items || []).filter(it => it.city === cityMode);
      if(term){
        const hit = items.filter(it => it.title.includes(term) || it.channel.includes(term));
        items = hit;
      }
      heading = CITY[cityMode].name + 'の動画';
    }
    let html = '';
    const _ckw = cMatchKey(term);
    if(_ckw){ html += '<h2>おすすめ動画</h2>' + cOrder(curatedData.keywords[_ckw]).map(cVitem).join(''); }
    if(items.length){
      html += '<h2>' + heading + '</h2>';
      for(const it of items){
        html += '<a class="vitem" href="https://www.youtube.com/watch?v=' + it.id
             + '" target="_blank" rel="noopener">'
             + '<img class="vthumb" src="https://i.ytimg.com/vi/' + it.id + '/mqdefault.jpg" alt="" loading="lazy">'
             + '<div><div class="vtitle">' + it.title + '</div>'
             + '<div class="vmeta">YouTube ・ ' + it.channel + ' ・ ' + fmtDate(it.date) + '</div></div></a>';
      }
    } else if(!_ckw){
      html += '<h2>' + heading + '</h2><div class="nempty">動画が見つかりませんでした。</div>';
    }
    box.innerHTML = html;
  }catch(e){
    box.innerHTML = '<div class="nempty">動画を読み込めませんでした。</div>';
  }
}

  if(!a) return;
  e.preventDefault();
  openJma(a.getAttribute('data-title'), a.getAttribute('data-raw'), a.getAttribute('data-fcst') === '1', a.getAttribute('data-body'));
});
document.getElementById('jmaClose').addEventListener('click', closeJma);
jmaModal.addEventListener('click', (e) => { if(e.target === jmaModal) closeJma(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeJma(); });

// 緊急ヘッダー(ホーム最上部・警報時のみ)
async function loadAlert(){
  try{
    const res = await fetch('news.json?_=' + Date.now());
    const data = await res.json();
    const al = data.alert;
    if(!al || !al.level || al.level < 3 || !al.warnings || !al.warnings.length) return;
    const bar = document.getElementById('alertBar');
    const wtxt = (al.warnings || []).map(function(w){
      return 'レベル' + (w.level||al.level) + ' ' + (w.name||w);
    }).join('・');
    let t = '';
    if(al.time){ const d = new Date(al.time);
      if(!isNaN(d)) t = (d.getMonth()+1)+'月'+d.getDate()+'日 '
        + String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' 発表'; }
    bar.className = 'show lv' + al.level;
    const bodyHtml = al.body ? '<div class="a-body">' + al.body + '</div>' : '';
    bar.innerHTML =
      '<div class="a-title"><span class="a-label">警戒レベル' + al.level + '相当</span>'
      + '上川地方　' + wtxt + ' 発表中</div>'
      + bodyHtml
      + '<div class="a-src">出典：気象庁　' + t
      + '　<a class="a-link" href="https://www.jma.go.jp/bosai/warning/#area_type=offices&area_code=012000" target="_blank" rel="noopener">気象庁で詳しく見る</a></div>';
  }catch(e){ }
}
